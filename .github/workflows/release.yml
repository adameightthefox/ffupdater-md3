name: Release
on:
  workflow_dispatch:
  push:
    tags: [ '[0-9]*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' ffupdater/build.gradle)
          [ "$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != versionName $V"; exit 1; }
      - name: Prepare signing key
        env:
          KS: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "Secret FORK_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/fork.jks"
      - name: Build release APK
        env:
          FORK_KEYSTORE_FILE: ${{ runner.temp }}/fork.jks
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ffupdater-release-apk
          path: ffupdater/build/outputs/apk/release/*.apk
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ffupdater-md3-${GITHUB_REF_NAME}.apk"
          cp ffupdater/build/outputs/apk/release/*.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes "Fork of FFUpdater. Uninstall the original app before installing." \
            || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
